script: forest_loss_GFW.R
name: Measure Forest loss
description:
  Measures forest change by subregion using supplied polygon boundaries, tree-cover thresholds, and Global Forest Watch (GFW) rasters.
author:
  - name: Maria Isabel Arce-Plata
    identifier: https://orcid.org/0000-0003-4024-9268
  - name: Guillaume Larocque
    identifier: https://orcid.org/0000-0002-5967-9156
  - name: Jurie Theron
    identifier: https://orcid.org/0000-0003-0739-8720
  - name: Samara Manzin
    identifier: https://orcid.org/0009-0005-9134-9981
license: CC BY
inputs:
  tree_cover:
    label: GFW tree cover in 2000
    description: Tree-cover raster produced by the Download Global Forest Watch data step.
    type: image/tiff;application=geotiff[]
  loss_before_t0:
    label: GFW loss before initial year
    description: Pre-period loss raster produced by the Download Global Forest Watch data step.
    type: image/tiff;application=geotiff[]
  loss_period:
    label: GFW loss during analysis period
    description: Analysis-period loss raster produced by the Download Global Forest Watch data step.
    type: image/tiff;application=geotiff[]
  forest_gain:
    label: GFW forest gain
    description: Forest-gain raster produced by the Download Global Forest Watch data step.
    type: image/tiff;application=geotiff[]
  spat_res:
    label: output spatial resolution
    description: Spatial resolution (in meters) for the output of the analysis.
    type: float
    example: 50
  crs:
    label: CRS
    description: Object containing CRS.
    type: bboxCRS
    example:
  area_type:
    label: Area type
    description: Use the same area type as the GFW download. Polygon clips to the supplied polygon; other choices use downloaded coverage.
    type: options
    options:
      - Country or region
      - Polygon
      - Raster
    example: Country or region
  area_file:
    label: Polygon or raster area file
    description: Shared download area file. When Polygon is selected, its geometry also clips the analysis.
    type: application/octet-stream
    example: null
  region_boundaries:
    label: Subregion boundaries
    description: Optional GeoPackage with one polygon layer. Leave blank to analyze the selected area as a whole. [See what the subregions look like in the Guinea example](https://github.com/user-attachments/assets/e6ccac41-c645-4de0-88a1-ef24a94a6c8a).
    type: application/geopackage+sqlite3
    example: /scripts/Forest_loss/gin_admbnda_adm1_ocha.gpkg
  region_field:
    label: Subregion name field
    description: Required with subregion boundaries. Name of the attribute field to match against the region column in the pasted threshold table.
    type: text
    example: group
  region_thresholds:
    label: Minimum tree-cover thresholds
    description: Required with subregion boundaries. Paste the header region, threshold and one name and percentage (0 to 100) per row. In a single-line field, separate rows with a backslash.
    type: text
    example: |-
      region, threshold
      Forest Guinea, 25
      Maritime Guinea, 15
      Middle Guinea, 15
      Upper Guinea, 15
  whole_area_threshold:
    label: Whole-area minimum tree cover (%)
    description: Used when subregion boundaries are blank. Enter a percentage from 0 to 100. Defaults to 15 if blank.
    type: float
    example: 15
  t_0:
    label: initial time
    description: Year where the analysis should start. Starts in 2000, check the time interval available for the
      Global Forest Watch data at https://stac.geobon.org/collections/gfw-lossyear.
    type: int
    example: 2000
  t_n:
    label: final time
    description: Year where the analysis should end (it should be later than Initial time). It should be inside the time interval for the
      Global Forest Watch data at https://stac.geobon.org/collections/gfw-lossyear.
    type: int
    example: 2020

outputs:
  habitat_change_map:
    label: Forest change map (raster)
    description: Raster map showing forest loss and gain for the given time range. Values 1 = no change, 2 = loss, 3 = gain.
    type: image/tiff;application=geotiff[]
    range: [1, 3]
  forest_change_barplot:
    label: Forest loss barplot
    description: Forest loss as a percentage of baseline forest (no change + loss, gain excluded), by subregion and for the analysis area.
    type: image/png
  forest_area_barplot:
    label: Forest area barplot
    description: Area (ha) by change category (no change, loss, gain), by subregion and for the analysis area.
    type: image/png
conda:
  channels:
    - conda-forge
    - r
  dependencies:
    - r-rjson
    - r-dplyr
    - r-tidyr
    - r-purrr
    - r-terra
    - r-stars
    - r-sf
    - r-readr
    - r-geodata
    - r-gdalcubes
    - r-rredlist
    - r-stringr
    - r-tmaptools
    - r-ggplot2
    - r-rstac
    - r-lubridate
    - r-RCurl
    - r-codetools
